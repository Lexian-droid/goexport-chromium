name: Build and release Chromium 87

on:
  push:
    tags:
      - "v87.0.4280.141-goexport.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-flash-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Fetch pinned Chromium files
        shell: bash
        run: |
          mkdir -p source/components/content_settings/core/browser
          mkdir -p source/chrome/browser/plugins
          base=https://raw.githubusercontent.com/chromium/chromium/87.0.4280.141
          curl --fail --location "$base/components/content_settings/core/browser/content_settings_registry.cc" \
            --output source/components/content_settings/core/browser/content_settings_registry.cc
          curl --fail --location "$base/chrome/browser/plugins/plugin_utils.cc" \
            --output source/chrome/browser/plugins/plugin_utils.cc
          curl --fail --location "$base/chrome/browser/plugins/plugin_info_host_impl.cc" \
            --output source/chrome/browser/plugins/plugin_info_host_impl.cc
      - name: Verify patch applies cleanly
        run: git -C source apply --check ../patches/ungoogled-chromium/enable-automatic-ppapi-flash.patch
      - name: Verify patched invariants
        shell: bash
        run: |
          git -C source apply ../patches/ungoogled-chromium/enable-automatic-ppapi-flash.patch
          python3 scripts/verify_patch.py source

  build-linux:
    needs: verify-flash-patch
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - name: Reclaim runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h
      - name: Clone Chromium 87 portable-Linux build recipe
        shell: bash
        run: |
          git clone --depth 1 --branch 87.0.4280.141-1.1 --recurse-submodules \
            https://github.com/ungoogled-software/ungoogled-chromium-portablelinux.git platform
          mkdir -p platform/patches/goexport
          cp patches/ungoogled-chromium/enable-automatic-ppapi-flash.patch \
            platform/patches/goexport/enable-automatic-ppapi-flash.patch
          printf '\ngoexport/enable-automatic-ppapi-flash.patch\n' >> platform/patches/series
      - name: Build and package in the platform's legacy Docker environment
        shell: bash
        working-directory: platform
        run: |
          docker build --rm -f docker-stage1/Dockerfile \
            -t ug-chromium-builder-stage1:latest docker-stage1
          docker build --rm -f Dockerfile-stage2 \
            -t ug-chromium-builder-stage2:latest .
          docker run --rm \
            -v "$PWD/build:/repo/build" \
            ug-chromium-builder-stage2:latest \
            bash -c "./build.sh && ./package.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: goexport-chromium-87-linux-x64
          path: platform/build/*.tar.xz
          if-no-files-found: error
          retention-days: 14

  legacy-platform-status:
    needs: verify-flash-patch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Record documented Windows and macOS build constraints
        shell: bash
        run: |
          sed -n '/## Windows x64/,/## macOS x64/p' BUILDING.md
          sed -n '/## macOS x64/,$p' BUILDING.md

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, legacy-platform-status]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: goexport-chromium-87-linux-x64
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
          body: |
            Custom ungoogled-chromium 87 build for isolated GoExport PPAPI Flash automation.

            This hosted release contains the portable Linux x64 build. Windows and macOS
            Chromium 87 builds require documented vintage self-hosted builders; see
            BUILDING.md.

            Adobe Flash Player is not included. Supply a legally obtained PPAPI library
            at runtime.
